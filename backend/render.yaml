databases:
  - name: westernpumps-db
    plan: free
    databaseName: westernpumps
    user: westernpumps

services:
  - type: web
    name: WesternPumps
    rootDir: backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: westernpumps-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://western-pumps-np2i.vercel.app"
      - key: DISABLE_AUTH
        value: "false"
      - key: ENABLE_AUTH_BOOTSTRAP
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_FULL_NAME
        sync: false
      - key: ENFORCE_HTTPS
        value: "true"
